<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tsutae 伝え — Skills shouldn't retire when people do.</title>
<meta name="description" content="tsutae connects families with older neighbours who come to your home and teach the skills they've spent a lifetime learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Lora:ital,wght@0,400..600;1,400..500&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FDFBF7; --beige:#F7F1E9; --paper:#FFFFFF;
  --forest:#1B3A2C; --forest-dk:#12291E;
  --coral:#E8836A; --coral-lt:#F6E2DA; --rust:#B5563A;
  --gold:#E9BC5C; --sage:#8CAA97; --sage-dk:#6E8F7A;
  --ink:#33322D; --ink-soft:#6C6A62; --ink-mute:#95928A;
  --line:#EAE2D6; --line-soft:#F2ECE3;
  --ghost:#E2DACD;
  --pink:#EFD8D0; --terr:#C4653F;
  --ok-bg:#E9F1EA; --ok:#3F7355; --note-bg:#FBF0E9;
  --r:20px; --shadow:0 1px 2px rgba(27,58,44,.04), 0 14px 40px rgba(27,58,44,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{
  background:var(--cream); color:var(--ink);
  font-family:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  font-size:16.5px; line-height:1.68; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:"Playfair Display","Noto Serif JP",Georgia,"Hiragino Mincho ProN",serif;
  font-weight:500;letter-spacing:-.015em;line-height:1.14;
}
h1{font-size:clamp(2.6rem,6.2vw,4.5rem)}
h2{font-size:clamp(2rem,4.2vw,3.05rem)}
h3{font-size:1.34rem;line-height:1.25}
h4{font-size:1.06rem;line-height:1.32}
em{font-style:italic;color:var(--rust)}
a{color:inherit;text-decoration:none}
/* Japanese needs a little more air and no negative tracking */
html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] h3,html[lang="ja"] h4{
  letter-spacing:.01em;line-height:1.4;font-feature-settings:"palt" 1;
}
html[lang="ja"] h1{font-size:clamp(2.1rem,5vw,3.5rem)}
html[lang="ja"] h2{font-size:clamp(1.7rem,3.5vw,2.5rem)}
html[lang="ja"] body{font-feature-settings:"palt" 1}

.wrap{max-width:1140px;margin:0 auto;padding:0 26px}
.sec{padding:104px 0}
.beige{background:var(--beige)}
.forest{background:var(--forest);color:#F3EEE4}
.forest h2,.forest h3,.forest h4{color:#FBF7F0}
.forest em{color:var(--gold)}

.eyebrow{
  font-size:.7rem;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
  color:var(--rust);margin-bottom:20px;display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--coral);display:block;flex:none}
.forest .eyebrow{color:var(--gold)}
.forest .eyebrow::before{background:var(--gold)}
.lead{font-family:"Lora","Noto Serif JP",Georgia,serif;font-size:1.14rem;line-height:1.75;color:var(--ink-soft);max-width:64ch;margin-top:22px}
html[lang="ja"] .lead{max-width:44em;line-height:2}
.forest .lead{color:#CFD8CE}
.sec-head{max-width:780px;margin-bottom:56px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:16px 32px;border-radius:999px;font-weight:600;font-size:.98rem;
  border:0;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  font-family:inherit;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--forest);color:#fff;box-shadow:0 8px 22px rgba(27,58,44,.18)}
.btn-dark:hover{background:var(--forest-dk)}
.btn-outline{background:transparent;border:1.6px solid var(--forest);color:var(--forest)}
.btn-outline:hover{background:rgba(27,58,44,.05)}
.btn-ghost{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ghost)}
.btn-sm{padding:11px 24px;font-size:.9rem}
.btn-lg{padding:19px 38px;font-size:1.03rem}
@media(max-width:520px){
  .btn{white-space:normal;text-align:center;max-width:100%}
  .btn-lg{padding:16px 24px;font-size:.95rem}
  .hero-cta .btn{width:100%}
}

/* ---------- nav ---------- */
.nav{
  position:sticky;top:0;z-index:60;background:rgba(253,251,247,.9);
  backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line-soft);
}
.nav-in{max-width:1140px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:baseline;gap:9px;font-family:"Playfair Display",serif;font-size:1.42rem;letter-spacing:-.02em}
.brand span.k{font-family:"Noto Serif JP",serif;font-size:.92rem;color:var(--rust);letter-spacing:.08em}
.nav-mid{display:flex;gap:24px;margin-left:auto;font-size:.9rem;color:var(--ink-soft);font-weight:500}
.nav-mid a{padding:6px 0;border-bottom:1.5px solid transparent;transition:.16s;white-space:nowrap}
.nav-mid a:hover{color:var(--forest);border-color:var(--coral)}
.nav-cta{display:flex;align-items:center;gap:11px;margin-left:auto}
.nav-mid + .nav-cta{margin-left:0}
@media(max-width:1040px){.nav-mid{display:none}}

/* language switch */
.langsw{
  display:inline-flex;background:var(--paper);border:1.4px solid var(--line);
  border-radius:999px;padding:3px;flex:none;
}
.langsw button{
  border:0;background:transparent;font-family:inherit;cursor:pointer;
  padding:6px 13px;border-radius:999px;font-size:.79rem;font-weight:600;
  color:var(--ink-mute);transition:.16s;white-space:nowrap;
}
.langsw button:hover{color:var(--forest)}
.langsw button[aria-pressed="true"]{background:var(--forest);color:#fff}

/* ---------- hero ---------- */
.hero{padding:78px 0 122px;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;right:-160px;top:-140px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--coral-lt),transparent 68%);opacity:.62;pointer-events:none;
}
.hero-grid{display:grid;grid-template-columns:1.07fr .93fr;gap:60px;align-items:center;position:relative;z-index:2}
.badge{
  display:inline-flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);
  padding:8px 17px;border-radius:999px;font-size:.79rem;font-weight:500;color:var(--ink-soft);margin-bottom:26px;
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.hero-cta{display:flex;gap:13px;flex-wrap:wrap;margin:34px 0 40px}
.proof{display:flex;gap:34px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:26px}
.proof div b{display:block;font-family:"Playfair Display",serif;font-size:1.72rem;font-weight:500;color:var(--forest);line-height:1.1}
.proof div b small{font-size:1rem}
.proof div span{font-size:.78rem;color:var(--ink-mute);letter-spacing:.02em}

.hcard{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px;position:relative}
.hcard-top{display:flex;gap:15px;align-items:center;margin-bottom:20px}
.avatar{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.75rem;background:var(--coral-lt);border:1px solid var(--line)}
.hcard-top h4{margin-bottom:3px}
.hcard-top p{font-size:.83rem;color:var(--ink-mute)}
.hcard-rows{border-top:1px solid var(--line-soft);padding-top:16px;display:grid;gap:11px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.88rem}
.hrow span:first-child{color:var(--ink-mute);flex:none}
.hrow span:last-child{font-weight:600;text-align:right}
.pt{background:var(--note-bg);color:var(--terr);padding:3px 11px;border-radius:999px;font-size:.78rem;font-weight:600}
.hcard-foot{margin-top:20px;display:flex;gap:9px}
.hcard-foot .btn{flex:1}
.float-note{
  position:absolute;bottom:-44px;left:-30px;background:var(--forest);color:#F3EEE4;
  padding:12px 18px;border-radius:16px;font-size:.8rem;box-shadow:var(--shadow);max-width:250px;line-height:1.6;
}
.float-note b{color:var(--gold)}
@media(max-width:880px){
  .hero-grid{grid-template-columns:1fr;gap:52px}
  .float-note{position:static;margin-top:18px;max-width:none}
  .hero{padding-bottom:80px}
}

/* ---------- cards ---------- */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:620px){.g4,.g2{grid-template-columns:1fr}}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:28px;
  box-shadow:0 1px 2px rgba(27,58,44,.03);transition:box-shadow .2s ease,transform .2s ease;
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.card p{font-size:.93rem;color:var(--ink-soft);margin-top:11px}
.num{width:36px;height:36px;border-radius:50%;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-family:"Playfair Display",serif;font-size:1rem;margin-bottom:18px}
.ico{font-size:1.6rem;margin-bottom:14px;display:block}
.forest .card{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13)}
.forest .card p{color:#C6D2C6}

/* ---------- skills ---------- */
.skill{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;gap:16px;align-items:flex-start;transition:.2s}
.skill:hover{border-color:var(--ghost);transform:translateY(-2px);box-shadow:var(--shadow)}
.skill .e{font-size:1.5rem;line-height:1;flex:none;margin-top:2px}
.skill h4{font-size:1.02rem;margin-bottom:7px}
.skill p{font-size:.86rem;color:var(--ink-soft);line-height:1.65}

/* ---------- timeline ---------- */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:20px}
.tl-item{padding:0 22px;border-left:2px solid rgba(255,255,255,.16)}
.tl-item:first-child{padding-left:0;border-left:0}
.tl-item .t{font-family:"Playfair Display",serif;font-size:1.5rem;color:var(--gold);margin-bottom:10px;display:block}
.tl-item h4{margin-bottom:7px}
.tl-item p{font-size:.88rem;color:#C6D2C6}
@media(max-width:880px){
  .tl{grid-template-columns:1fr;gap:26px}
  .tl-item,.tl-item:first-child{padding:0 0 0 22px;border-left:2px solid rgba(255,255,255,.16)}
}

/* ---------- quote ---------- */
.quote{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:0 22px 22px 0;padding:30px 34px;max-width:720px;margin-top:46px}
.quote p{font-family:"Lora","Noto Serif JP",Georgia,serif;font-size:1.18rem;font-style:italic;line-height:1.7;color:var(--ink)}
html[lang="ja"] .quote p{font-style:normal}
.quote cite{display:block;margin-top:16px;font-style:normal;font-size:.83rem;color:var(--ink-mute)}
</style>
</head>
<body>

<!-- ============ NAV ============ -->
<nav class="nav">
  <div class="nav-in">
    <a href="#top" class="brand">tsutae <span class="k">伝え</span></a>
    <div class="nav-mid">
      <a href="#how"     data-en="How it works" data-ja="仕組み"></a>
      <a href="#skills"  data-en="What you learn" data-ja="学べること"></a>
      <a href="#browse"  data-en="Near you" data-ja="近くで探す"></a>
      <a href="#trust"   data-en="Trust" data-ja="安心"></a>
      <a href="#points"  data-en="Points" data-ja="ポイント"></a>
      <a href="#mentors" data-en="Teach" data-ja="教える"></a>
    </div>
    <div class="nav-cta">
      <div class="langsw" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      </div>
      <a href="#join" class="btn btn-dark btn-sm" data-en="Sign up" data-ja="登録する"></a>
    </div>
  </div>
</nav>

<!-- ============ HERO ============ -->
<header class="hero" id="top">
  <div class="wrap hero-grid">
    <div>
      <div class="badge"><span class="dot"></span><span data-en="Now matching in Setagaya, Tokyo" data-ja="東京・世田谷区でマッチング開始"></span></div>
      <h1 data-en="Learn what can't be <em>googled.</em>" data-ja="検索では、<br><em>教われない。</em>"></h1>
      <p class="lead"
         data-en="tsutae connects you with older neighbours who come to your home and teach what they've spent a lifetime learning — how to fold a gyoza so it holds, why that seam keeps splitting, when the soil is ready. Not a video. Not a class. Someone in your kitchen, showing you with their hands."
         data-ja="「伝え」は、近所に暮らす人生の先輩をご自宅にお招きし、何十年もかけて身につけた技を教わるサービスです。開かない餃子の包み方。その縫い目がほつれる理由。土が整う時期。動画でも教室でもなく、同じ台所で、手を動かしながら。"></p>
      <div class="hero-cta">
        <a href="#browse"  class="btn btn-dark btn-lg"    data-en="Find someone near you" data-ja="近くの先生を探す"></a>
        <a href="#mentors" class="btn btn-outline btn-lg" data-en="I want to teach" data-ja="教える側になる"></a>
      </div>
      <div class="proof">
        <div><b>42<small data-en=" yrs" data-ja="年"></small></b><span data-en="average experience" data-ja="平均経験年数"></span></div>
        <div><b>15<small data-en=" min" data-ja="分"></small></b><span data-en="maximum distance" data-ja="片道の上限"></span></div>
        <div><b>¥0</b><span data-en="to meet first" data-ja="初回の顔合わせ"></span></div>
      </div>
    </div>

    <div class="hcard">
      <div class="hcard-top">
        <div class="avatar">🥟</div>
        <div>
          <h4 data-en="Keiko, 72" data-ja="恵子さん・72歳"></h4>
          <p data-en="Home cooking — 45 years" data-ja="家庭料理 — 45年"></p>
        </div>
      </div>
      <div class="hcard-rows">
        <div class="hrow"><span data-en="Teaching" data-ja="教えること"></span><span data-en="Gyoza from scratch" data-ja="皮から作る餃子"></span></div>
        <div class="hrow"><span data-en="Distance" data-ja="距離"></span><span data-en="8 min walk" data-ja="徒歩8分"></span></div>
        <div class="hrow"><span data-en="Session" data-ja="所要時間"></span><span data-en="110 min" data-ja="110分"></span></div>
        <div class="hrow"><span data-en="Price" data-ja="料金"></span><span>¥7,000</span></div>
        <div class="hrow"><span data-en="You earn" data-ja="獲得"></span><span class="pt">+250 pt</span></div>
      </div>
      <div class="hcard-foot">
        <a href="#trust"  class="btn btn-dark btn-sm"  data-en="Meet first" data-ja="まず会う"></a>
        <a href="#browse" class="btn btn-ghost btn-sm" data-en="Profile" data-ja="紹介を見る"></a>
      </div>
      <div class="float-note"
           data-en="<b>She lives 8 minutes away.</b><br>That's the whole idea."
           data-ja="<b>徒歩8分のところに住んでいます。</b><br>それが、いちばん大事なことです。"></div>
    </div>
  </div>
</header>

<!-- ============ HOW IT WORKS ============ -->
<section class="sec" id="how">
  <div class="wrap">
    <div class="sec-head">
      <p class="eyebrow" data-en="How it works" data-ja="仕組み"></p>
      <h2 data-en="Meet first. <em>Then open the door.</em>" data-ja="まず外で会う。<em>それから、扉を開ける。</em>"></h2>
      <p class="lead"
         data-en="Every tsutae session starts the same way — with a free thirty minutes somewhere public, so nobody is ever a stranger in your home."
         data-ja="「伝え」はいつも、公共の場での30分の顔合わせから始まります。ご自宅に迎えるのは、もう知らない人ではありません。"></p>
    </div>
    <div class="grid g4">
      <div class="card">
        <div class="num">1</div>
        <h4 data-en="Find someone close" data-ja="近くの先生を見つける"></h4>
        <p data-en="Browse people within fifteen minutes of your home. See what they teach, how long they've done it, and when they're free."
           data-ja="ご自宅から15分以内に住む方を探します。教えられること、経験年数、空いている日がひと目でわかります。"></p>
      </div>
      <div class="card">
        <div class="num">2</div>
        <h4 data-en="Meet on neutral ground" data-ja="まず、外で会う"></h4>
        <p data-en="Thirty free minutes at a café or community centre. Bring your child. Either side can walk away afterwards — no reason needed."
           data-ja="カフェや児童館で30分、無料で顔合わせ。お子さまもご一緒に。そのあとは、どちらからでも理由なくお断りできます。"></p>
      </div>
      <div class="card">
        <div class="num">3</div>
        <h4 data-en="They come to your kitchen" data-ja="ご自宅で、一緒に"></h4>
        <p data-en="Ninety to a hundred and twenty minutes at home, with a parent there. Not a lecture — you make the thing together, then sit down and eat it."
           data-ja="ご自宅で90〜120分。保護者の方の同席が必須です。講義ではなく、一緒に作って、一緒に食べます。"></p>
      </div>
      <div class="card">
        <div class="num">4</div>
        <h4 data-en="Book again, or someone new" data-ja="また会う。別の人に会う。"></h4>
        <p data-en="Every session stands alone — no subscription, no commitment. Loved Keiko-san? Book her again in one tap. Curious about carpentry? Find someone else."
           data-ja="毎回が単発です。定額制も回数の縛りもありません。恵子さんをもう一度呼ぶのも、木工の先生を新しく探すのも自由です。"></p>
      </div>
    </div>

    <div class="quote">
      <p data-en="“I'm not being helped. I'm the one teaching.”" data-ja="「助けてもらっているんじゃない。教えているんです。」"></p>
      <cite data-en="Haruo, 78 — woodwork, 52 years" data-ja="治夫さん・78歳 — 木工、52年"></cite>
    </div>
  </div>
</section>

<!-- ============ SKILLS ============ -->
<section class="sec beige" id="skills">
  <div class="wrap">
    <div class="sec-head">
      <p class="eyebrow" data-en="What you learn" data-ja="学べること"></p>
      <h2 data-en="The things nobody <em>writes down.</em>" data-ja="どこにも<em>書かれていないこと。</em>"></h2>
      <p class="lead"
         data-en="School teaches what's on the test. Somebody who has done it for forty years teaches the rest — the feel of the dough, the sound of a chain that's about to go, the week the seedlings need moving."
         data-ja="学校は、試験に出ることを教えてくれます。40年やってきた人は、その先を教えてくれます。生地の手ざわり、切れる前のチェーンの音、苗を植え替える一週間。"></p>
    </div>
    <div class="grid g3">
      <div class="skill"><span class="e">🥟</span><div>
        <h4 data-en="The kitchen" data-ja="台所のこと"></h4>
        <p data-en="Gyoza from scratch, dashi that actually tastes of something, knife grip, おせち in December, and everything a recipe leaves out."
           data-ja="皮から作る餃子、ちゃんと味のする出汁、包丁の持ち方、師走のおせち。レシピが書き落としていることのすべて。"></p></div></div>
      <div class="skill"><span class="e">🧵</span><div>
        <h4 data-en="Mending & sewing" data-ja="繕いもの"></h4>
        <p data-en="Buttons, hems, invisible patches, 刺し子 — and why your grandmother's coat outlasted four of yours."
           data-ja="ボタン、裾上げ、目立たない当て布、刺し子。祖母のコートが、あなたのコート4着より長持ちした理由。"></p></div></div>
      <div class="skill"><span class="e">🌱</span><div>
        <h4 data-en="Growing things" data-ja="育てる"></h4>
        <p data-en="Balcony vegetables, the first tomato, soil that isn't dead, and what to do in each month of the year."
           data-ja="ベランダの野菜、はじめてのトマト、死んでいない土。そして、月ごとにやるべきこと。"></p></div></div>
      <div class="skill"><span class="e">🔨</span><div>
        <h4 data-en="Fixing things" data-ja="直す"></h4>
        <p data-en="A dripping tap, a door that sticks, a wobbling shelf, a bicycle chain — and which six tools are actually worth owning."
           data-ja="水が垂れる蛇口、開きにくい戸、ぐらつく棚、自転車のチェーン。そして、本当に持つ価値のある道具六つ。"></p></div></div>
      <div class="skill"><span class="e">🎋</span><div>
        <h4 data-en="Craft & tradition" data-ja="手仕事と伝統"></h4>
        <p data-en="折り紙, 風呂敷, 書道, 竹細工, and the local festival crafts that leave with the people who know them."

const CATS = [
 {k:"all",      e:"◎",  en:"Everyone", ja:"すべて"},
 {k:"kitchen",  e:"🥟", en:"Kitchen",  ja:"台所"},
 {k:"mending",  e:"🧵", en:"Mending",  ja:"繕い"},
 {k:"growing",  e:"🌱", en:"Growing",  ja:"育てる"},
 {k:"fixing",   e:"🔨", en:"Fixing",   ja:"直す"},
 {k:"craft",    e:"🎋", en:"Craft",    ja:"手仕事"},
 {k:"money",    e:"💰", en:"Money",    ja:"お金"},
 {k:"outdoors", e:"🎣", en:"Outdoors", ja:"外"},
 {k:"work",     e:"💼", en:"Work",     ja:"仕事"}
];

let activeCat = "all", selected = 1;
const mapbox = document.getElementById('mapbox');
const panel  = document.getElementById('panel');
const chips  = document.getElementById('chips');
const countEl= document.getElementById('count');

chips.innerHTML = CATS.map(c =>
  `<button class="chip" data-cat="${c.k}"><span>${c.e}</span><span data-en="${c.en}" data-ja="${c.ja}"></span></button>`).join('');

M.forEach(m => {
  const b = document.createElement('button');
  b.className = 'pin';
  b.dataset.id = m.id; b.dataset.cat = m.cat;
  b.style.left = m.x + '%'; b.style.top = m.y + '%';
  b.innerHTML = `<div class="pin-b"><span>${m.e}</span></div>
                 <span class="lab" data-en="${m.lab.en}" data-ja="${m.lab.ja}"></span>`;
  b.addEventListener('click', () => { selected = m.id; renderBrowse(); });
  mapbox.appendChild(b);
});

function renderBrowse(){
  const shown = M.filter(m => activeCat === 'all' || m.cat === activeCat);
  if(!shown.some(m => m.id === selected)) selected = shown.length ? shown[0].id : null;

  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.cat === activeCat));
  document.querySelectorAll('.pin').forEach(p => {
    p.classList.toggle('hidden', !(activeCat === 'all' || p.dataset.cat === activeCat));
    p.classList.toggle('sel', +p.dataset.id === selected);
  });

  countEl.innerHTML = `<b>${shown.length}</b> <span
      data-en="mentors within 15 minutes of your home"
      data-ja="名が、ご自宅から15分以内にいます"></span>`;

  const m = M.find(x => x.id === selected);
  panel.innerHTML = !m
    ? `<p class="lead" style="margin:0" data-en="Nobody nearby teaches this yet." data-ja="この分野の先生は、まだ近くにいません。"></p>`
    : `<div class="verified"><span data-en="✓ Verified &amp; DBS-checked" data-ja="✓ 本人確認・DBS確認済み"></span></div>
       <div class="panel-top">
         <div class="avatar">${m.e}</div>
         <h3 data-en="${m.n.en}" data-ja="${m.n.ja}"></h3>
       </div>
       <span class="ptrade" data-en="${m.t.en}" data-ja="${m.t.ja}"></span>
       <div class="pquote" data-en="“${m.q.en}”" data-ja="「${m.q.ja}」"></div>
       <div class="rows">
         <div class="hrow"><span data-en="Experience" data-ja="経験"></span><span data-en="${m.yrs} years" data-ja="${m.yrs}年"></span></div>
         <div class="hrow"><span data-en="Distance" data-ja="距離"></span><span data-en="${m.d.en}" data-ja="${m.d.ja}"></span></div>
         <div class="hrow"><span data-en="Session" data-ja="料金"></span><span>¥${m.price.toLocaleString()}</span></div>
         <div class="hrow"><span data-en="You earn" data-ja="獲得"></span><span class="pt">+${m.pts} pt</span></div>
       </div>
       <div class="avail">${m.s.map((s,i)=>`<span class="slot${m.f.includes(i)?' free':''}" data-en="${s.en}" data-ja="${s.ja}"></span>`).join('')}</div>
       <div class="panel-btns">
         <a href="#join" class="btn btn-dark btn-sm" data-en="Request a first meeting" data-ja="顔合わせを申し込む"></a>
         <a href="#trust" class="btn btn-ghost btn-sm" data-en="How we check mentors" data-ja="審査について"></a>
       </div>`;
  applyLang();
}

chips.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if(!c) return;
  activeCat = c.dataset.cat;
  renderBrowse();
});

/* ---------------- language switch ---------------- */
let LANG = 'en';

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-en]').forEach(el => {
    const v = el.dataset[LANG];
    if(v === undefined) return;
    el.innerHTML = v;
  });
  document.querySelectorAll('.langsw button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.title = LANG === 'ja'
    ? '伝え tsutae — 技は、人と一緒に引退しない。'
    : "tsutae 伝え — Skills shouldn't retire when people do.";
}

document.querySelectorAll('.langsw button').forEach(b => {
  b.addEventListener('click', () => {
    LANG = b.dataset.lang;
    try { localStorage.setItem('tsutae-lang', LANG); } catch(e){}
    applyLang();
  });
});

try {
  const saved = localStorage.getItem('tsutae-lang');
  if(saved === 'en' || saved === 'ja') LANG = saved;
  else if((navigator.language || '').toLowerCase().startsWith('ja')) LANG = 'ja';
} catch(e){}

renderBrowse();
applyLang();
</script>
